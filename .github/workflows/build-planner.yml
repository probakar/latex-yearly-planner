name: Build Yearly Planner

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Planner year'
        required: true
        default: '2027'
  push:
    branches:
      - 'arena/*'
      - 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Build planner PDF
        env:
          PLANNER_YEAR: ${{ github.event.inputs.year || '2027' }}
          PASSES: 2
          CFG: cfg/base.yaml,cfg/rm2.base.yaml,cfg/template_months_on_side.yaml,cfg/rm2.mos.default.yaml
          NAME: my_olive_planner_${{ github.event.inputs.year || '2027' }}
        run: |
          chmod +x single.sh
          ./single.sh || (cat out/*.log && exit 1)
          cp "${NAME}.pdf" out/

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: planner-pdf
          path: out/*.pdf

      - name: Publish PDFs to branch (arena only)
        if: startsWith(github.ref, 'refs/heads/arena/')
        run: |
          mkdir -p ref deliver
          cp out/*.pdf ref/ 2>/dev/null || true
          mv ref/my_olive_planner_2027.pdf ref/reference_planner_2027.pdf 2>/dev/null || true
          cp out/*.pdf deliver/ 2>/dev/null || true
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f ref/*.pdf deliver/*.pdf
          git commit -m "Build planner PDFs via CI [skip ci]" || echo "nothing new to commit"
          git push
