name: Fetch reference planner PDF

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arena branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a06268-latex-yearly-planner

      - name: Download existing planner artifact
        id: dl
        uses: actions/download-artifact@v4
        with:
          run-id: "33621348279"
          name: planner-pdf
          path: refdl
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build planner from source (fallback)
        if: steps.dl.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go texlive-full
          chmod +x single.sh
          PLANNER_YEAR=2027 PASSES=2 \
            CFG="cfg/base.yaml,cfg/rm2.base.yaml,cfg/template_months_on_side.yaml,cfg/rm2.mos.default.yaml" \
            NAME=my_olive_planner_2027 \
            ./single.sh || (cat out/*.log && exit 1)
          mkdir -p refdl && cp my_olive_planner_2027.pdf refdl/

      - name: Commit reference PDF into repo
        run: |
          mkdir -p ref
          cp refdl/*.pdf ref/reference_planner_2027.pdf
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f ref/reference_planner_2027.pdf
          git commit -m "Add reference planner PDF (2027 olive build)" || echo "nothing new to commit"
          git push
